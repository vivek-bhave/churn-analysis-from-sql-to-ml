version: "3.9"

services:

  database:
    image: mariadb:11
    container_name: churn_database

    restart: always

    environment:
      MARIADB_ROOT_PASSWORD: root123
      MARIADB_DATABASE: churn_db
      MARIADB_USER: vivek
      MARIADB_PASSWORD: password123

    ports:
      - "3306:3306"

    volumes:
      - mariadb_data:/var/lib/mysql
      - ./sql/recommendation_engine.sql:/docker-entrypoint-initdb.d/recommendation_engine.sql

  backend:
    build:
      context: .
      dockerfile: Dockerfile.app

    container_name: churn_backend

    restart: always

    depends_on:
      - database

    ports:
      - "8000:8000"

    volumes:
      - .:/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit

    container_name: churn_frontend

    restart: always

    depends_on:
      - backend

    ports:
      - "8501:8501"

    volumes:
      - .:/app

volumes:
  mariadb_data: