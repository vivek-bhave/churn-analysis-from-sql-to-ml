
services:
  database:
    image: mariadb:11
    container_name: churn_database

    restart: always

    env_file:
      - .env

    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}

    volumes:
      - mariadb_data:/var/lib/mysql
      - ./sql/recommendation_engine.sql:/docker-entrypoint-initdb.d/recommendation_engine.sql

  backend:
    build:
      context: .
      dockerfile: Dockerfile.app

    container_name: churn_backend

    restart: always

    depends_on:
      - database

    ports:
      - "8000:8000"

    env_file:
    - .env

    

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit

    container_name: churn_frontend

    restart: always

    depends_on:
      - backend

    ports:
      - "8501:8501"

    

volumes:
  mariadb_data: